<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>电商自动化建设路线图</title>
  <style>:root{--bg:#0e1013;--card:#14171b;--card2:#111418;--ink:#eae6dc;--muted:#9ba19e;--muted2:#c2c9c6;--line:#23282b;--line2:#30373a;--mint:var(--mint);--blue:var(--blue);--amber:var(--amber);--glow1:rgba(var(--mint-rgb),.12);--glow2:rgba(var(--blue-rgb),.08);--shadow:0 18px 50px rgba(0,0,0,.55)}
body[data-theme="light"]{--bg:#f5f1e8;--card:#ffffff;--card2:#faf7ef;--ink:#2b2a26;--muted:#6b6d68;--muted2:#4a4b45;--line:#e3ded2;--line2:#c9c3b4;--mint:#3f7d72;--blue:#4f7ba3;--amber:#9c7c3f;--glow1:rgba(12,156,121,.10);--glow2:rgba(53,102,156,.08);--shadow:0 18px 50px rgba(30,45,90,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,"Microsoft YaHei",sans-serif;transition:background .3s,color .3s}button{font:inherit}
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));z-index:99;box-shadow:0 0 12px var(--mint)}
main{min-height:100vh;background:radial-gradient(ellipse 80% 50% at 50% -10%,var(--glow1),transparent 60%),linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px),var(--bg);background-size:auto,34px 34px,34px 34px,auto}
.shell{width:min(980px,calc(100% - 30px));margin:auto}.top{min-height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.top a{color:var(--mint);text-decoration:none;font:12px monospace;transition:color .2s}.top a:hover{text-shadow:0 0 10px var(--mint)}.top-right{display:flex;gap:14px;align-items:center}.top span{color:#8a928e;font:12.5px monospace;text-align:right}.theme-btn{background:none;border:1px solid var(--line2);border-radius:14px;color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.25s}.theme-btn:hover{color:var(--mint);border-color:var(--mint);box-shadow:0 0 12px rgba(var(--mint-rgb),.3)}
.hero{padding:58px 0 36px}.hero small{color:var(--mint);font:12.5px monospace;letter-spacing:.1em}.hero h1{font-size:clamp(30px,5vw,48px);margin:14px 0 10px;background:linear-gradient(120deg,var(--mint) 8%,#d6e4dc 32%,var(--blue) 72%);-webkit-background-clip:text;background-clip:text;color:transparent}body[data-theme="light"] .hero h1{background:linear-gradient(120deg,#3f7d72,#4f7ba3);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:14px;line-height:1.8}
.privacy{border:1px solid #2e3430;background:#10131c;border-radius:10px;padding:16px 18px;margin:0 0 28px;color:#aeb8cd;font-size:12.5px;line-height:1.8;box-shadow:0 0 22px rgba(var(--mint-rgb),.06)}body[data-theme="light"] .privacy{background:#f2ecdf;border-color:#cfc7b2}.privacy b{color:var(--mint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}.stat{padding:20px;background:var(--card2);border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{display:block;color:#687471;font-size:12.5px;letter-spacing:.08em}.stat b{display:block;font:300 26px monospace;margin:8px 0;background:linear-gradient(120deg,var(--mint),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}.stat small{color:#79827e;font-size:12.5px}.bar-wrap{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:3px;transition:width .6s ease;box-shadow:0 0 10px var(--mint)}
.flow{position:relative;padding-bottom:60px}.flow:before{content:"";position:absolute;top:20px;bottom:80px;left:19px;width:1px;background:linear-gradient(180deg,var(--mint),transparent 70%)}.phase{display:grid;grid-template-columns:40px 1fr;gap:18px;position:relative;padding-bottom:30px}.num{width:40px;height:40px;border:2px solid #333b4e;background:var(--bg);border-radius:50%;display:grid;place-items:center;z-index:1;color:#68736f;font:12px monospace;transition:.3s;box-shadow:0 0 0 4px var(--bg)}.phase.active .num{border-color:var(--mint);color:var(--mint);box-shadow:0 0 16px rgba(var(--mint-rgb),.35)}.phase.done .num{background:var(--mint);border-color:var(--mint);color:#07100e;box-shadow:0 0 18px rgba(var(--mint-rgb),.5)}
.body{padding-top:2px}.heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.heading small{color:#8a928e;font:10.5px monospace;letter-spacing:.1em}.heading h2{font-size:18px;margin:5px 0 0}.state{height:max-content;border:1px solid #333b4e;border-radius:13px;padding:5px 10px;color:#8a928e;font:10.5px monospace;letter-spacing:.06em}.phase.active .state{border-color:#2d6256;color:var(--mint);background:rgba(var(--mint-rgb),.07)}.phase.done .state{border-color:var(--mint);color:#07100e;background:var(--mint)}
.task{display:flex;flex-direction:column;gap:6px;padding:13px 0;border-bottom:1px dashed #2a3040}.task:last-child{border:0}.task label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--muted2);transition:color .2s}.task label:hover{color:var(--ink)}.task input{display:none}.task .box{width:16px;height:16px;border:1px solid #3a4743;border-radius:5px;display:inline-grid;place-items:center;transition:.25s;flex:none;background:var(--card)}.task input:checked+.box{background:var(--mint);border-color:var(--mint)}.task input:checked+.box:after{content:"✓";color:#07100e;font-size:14px;font-weight:700}.task input:checked~span{color:var(--ink)}.result{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 0 26px}.result b{color:var(--mint);font-weight:600}.result.ready{color:#7fd8c4}.result.ready b{color:var(--mint)}
footer{border-top:1px solid var(--line);padding:32px 0 44px;color:#79827e;font:10.5px monospace}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}.reveal.in{opacity:1;transform:none}
@media(max-width:760px){.shell{width:calc(100% - 28px)}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.hero{padding:44px 0 28px}.flow:before{left:15px}.num{width:32px;height:32px}.phase{grid-template-columns:32px 1fr;gap:14px}}:root{--mint-rgb:95,157,146;--blue-rgb:123,165,201;--amber-rgb:201,168,106;--red-rgb:192,95,78}
body[data-palette="gugong"]{--mint:#d4a94e;--blue:#c24b3a;--amber:#3d6e9e;--red:#a03024;--mint-rgb:212,169,78;--blue-rgb:194,75,58;--amber-rgb:61,110,158;--red-rgb:160,48,36}
body[data-palette="dunhuang"]{--mint:#2fa58f;--blue:#2e7fc1;--amber:#d9a441;--red:#c0392b;--mint-rgb:47,165,143;--blue-rgb:46,127,193;--amber-rgb:217,164,65;--red-rgb:192,57,43}
body[data-palette="qinghua"]{--mint:#2b5d9e;--blue:#5a87b8;--amber:#c9a86a;--red:#b05548;--mint-rgb:43,93,158;--blue-rgb:90,135,184;--amber-rgb:201,168,106;--red-rgb:176,85,72}
.palette{display:flex;gap:7px;align-items:center}.palette button{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0;transition:.25s;flex:none}.palette button:hover{transform:scale(1.15)}.palette button.on{border-color:var(--ink);box-shadow:0 0 10px rgba(var(--mint-rgb),.5)}
@media(max-width:760px){.palette{display:none}}</style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="top shell"><a href="index.html">← 返回档案馆</a><div class="top-right"><span>仅展示脱敏成果 · 进度保存在当前设备</span><div class="palette" id="palette" title="配色方案"><button data-p="tiangqing" style="background:#5f9d92"></button><button data-p="gugong" style="background:#d4a94e"></button><button data-p="dunhuang" style="background:#2fa58f"></button><button data-p="qinghua" style="background:#2b5d9e"></button></div><button class="theme-btn" id="themeBtn" title="切换主题">◐</button></div></header>
  <main class="shell">
    <section class="hero"><small>BUILD ROADMAP · STRATEGY TO EXECUTION</small><h1>电商自动化建设路线图</h1><p>每完成一个任务即可勾选。完成后，对应位置将同步可公开的成果摘要。</p></section>
    <aside class="privacy"><b>成果展示规则</b>　只展示成果名称、完成数量、完成状态与脱敏说明；不展示底层代码、原始经营数据、店铺账号、客户订单、私有 Skill 或具体操作参数。</aside>
    <section class="stats"><div class="stat"><span>总体进度</span><b id="total">0%</b><small id="count">0 / 19 项完成</small><div class="bar-wrap"><div class="bar" id="bar"></div></div></div><div class="stat"><span>当前阶段</span><b id="current">01</b><small id="currentName">基础治理与目录标准</small></div><div class="stat"><span>最终交付</span><b>商品包</b><small>人工审核后上架</small></div></section>
    <section class="flow" id="flow"></section>
  </main>
  <footer class="shell">CODEX × E-COMMERCE · PRIVACY-SAFE DELIVERY</footer>
  <script>
const phases = [
      {id:'01',code:'FOUNDATION',name:'基础治理与目录标准',tasks:[
        {name:'确定自动化系统的公开与私密边界',done:true,result:'已建立 1 套公开/私密边界规则'},
        {name:'建立统一产品文件夹和命名规则',done:true,result:'已建立 1 套生产目录、1 套命名规范与 1 个单产品模板'},
        {name:'确定人工审核与平台执行门槛',done:true,result:'已建立 1 套运营审核与最终执行门槛'}]},
      {id:'02',code:'DATA',name:'经营数据中心',tasks:[
        {name:'建立按报表分类的数据上传入口',done:true,result:'已完成 3 类报表（商品/推广/内容）自动解析入库，10 张业务表，去重幂等，本地自检 6/6 通过'},
        {name:'统一销售额、退款、消耗和 ROI 字段',done:true,result:'已统一口径：销售/退款/访客/买家/件数/加购；推广花费=商品+内容合并口径，与计划报表总额交叉核对一致'},
        {name:'生成异常监控及日报基础数据',done:true,result:'已产出经营看板：7/15/30/自定义周期、环比变化、每日趋势、双轴图表与计划 9 级分级'}]},
      {id:'03',code:'PRODUCT',name:'选品与测试池',tasks:[
        {name:'建立候选产品标准字段（类目/成本/售价/货源/毛利模型）',result:'待产出选品字段模板'},
        {name:'记录推广测试数据与潜力判断（花费/销量/转化/结论）',result:'待产出测试记录结构'},
        {name:'输出淘汰、继续测试或准备上新的结论',result:'待产出决策规则与摘要'}]},
      {id:'04',code:'PRODUCTION',name:'商品上新生产线',tasks:[
        {name:'建立复制上新、AI 图片与审核留痕流程',done:true,result:'已建立 1 条上新生产线与 1 份多节点生产台账'},
        {name:'整理商品、SKU、价格和卖点资料',result:'待产出商品资料包（名称/SKU/价格/卖点/素材清单）'},
        {name:'生成主图、详情图和视频生产任务',result:'待产出视觉任务包（主图/详情页/短视频）'},
        {name:'输出待上新商品包和检查清单',result:'待产出上新交付包（含发布检查清单）'}]},
      {id:'05',code:'GROWTH',name:'推广监控与经营复盘',tasks:[
        {name:'生成推广计划和监控指标',done:true,result:'已完成计划级监控：花费 TOP 商品、访客/加购/转化率与分级标签'},
        {name:'输出保留、调整和暂停建议',done:true,result:'已产出 9 级分级处置建议（观察/止损/预警/优化/标杆等）'},
        {name:'保留人工确认，不自动修改平台',done:true,result:'平台侧零自动操作，所有处置由人工确认执行'}]},
      {id:'06',code:'REPORTING',name:'日报、周报与月报系统',tasks:[
        {name:'自动生成日报与异常清单（每日核心指标+异常项）',result:'待产出日报样例'},
        {name:'自动生成周度趋势和行动计划（环比+下周计划）',result:'待产出周报样例'},
        {name:'自动生成月度经营复盘（结构+结论+下一步）',result:'待产出月报样例'}]}
    ];
    flow.innerHTML = phases.map((p,pi)=>`<article class="phase reveal" data-phase="${p.id}" style="transition-delay:${pi*50}ms"><div class="num">${p.id}</div><div class="body"><div class="heading"><div><small>${p.code}</small><h2>${p.name}</h2></div><span class="state">未开始</span></div>${p.tasks.map(t=>`<div class="task"><label><input type="checkbox" ${t.done?'checked':''}><span class="box"></span><span>${t.name}</span></label><p class="result"><b>成果</b> · ${t.result}</p></div>`).join('')}</div></article>`).join('');
    const checks=[...document.querySelectorAll('input')], nodes=[...document.querySelectorAll('.phase')], key='commerce-roadmap-v4';
    try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved))checks.forEach((c,i)=>c.checked=!!saved[i])}catch(e){}
    function update(){const done=checks.filter(c=>c.checked).length;total.textContent=Math.round(done/checks.length*100)+'%';count.textContent=`${done} / ${checks.length} 项完成`;bar.style.width=Math.round(done/checks.length*100)+'%';let active=nodes[nodes.length-1];nodes.forEach(n=>{const cs=[...n.querySelectorAll('input')],d=cs.filter(c=>c.checked).length;n.classList.toggle('done',d===cs.length);n.classList.toggle('active',d>0&&d<cs.length);n.querySelector('.state').textContent=d===cs.length?'已完成':d>0?'进行中':'未开始';cs.forEach(c=>c.closest('.task').querySelector('.result').classList.toggle('ready',c.checked));if(cs.some(c=>!c.checked)&&active===nodes[nodes.length-1])active=n});current.textContent=active.dataset.phase;currentName.textContent=active.querySelector('h2').textContent;try{localStorage.setItem(key,JSON.stringify(checks.map(c=>c.checked)))}catch(e){}}
    checks.forEach(c=>c.onchange=update);update();
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
    document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
    const themeBtn=document.getElementById('themeBtn'),tkey='archive-theme';const savedT=localStorage.getItem(tkey)||'dark';document.body.dataset.theme=savedT;themeBtn.textContent=savedT==='light'?'☾':'◐';themeBtn.onclick=()=>{const next=document.body.dataset.theme==='light'?'dark':'light';document.body.dataset.theme=next;themeBtn.textContent=next==='light'?'☾':'◐';try{localStorage.setItem(tkey,next)}catch(e){}};
    addEventListener('scroll',()=>{const h=document.documentElement;progress.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

  const pk='archive-palette',pb=document.getElementById('palette');const savedP=localStorage.getItem(pk)||'tiangqing';document.body.dataset.palette=savedP;if(pb){[...pb.children].forEach(b=>b.classList.toggle('on',b.dataset.p===savedP));pb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.body.dataset.palette=b.dataset.p;localStorage.setItem(pk,b.dataset.p);[...pb.children].forEach(x=>x.classList.toggle('on',x===b))})}</script>
</body>
</html>
